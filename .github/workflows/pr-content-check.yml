name: Validate content pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache Quartz plugins
        uses: actions/cache@v6
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Format changed Markdown and workflow
        run: npx prettier content/notes/context-compilation-regression.md .github/workflows/pr-content-check.yml --write
      - name: Commit formatting changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/notes/context-compilation-regression.md .github/workflows/pr-content-check.yml
            git commit -m "Format context compilation article"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Check types and formatting
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Quartz
        run: npx quartz build
