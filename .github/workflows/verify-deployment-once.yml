name: Verify deployed article once

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  verify:
    if: github.event.head_commit.message == 'Verify public article deployment'
    runs-on: ubuntu-latest
    steps:
      - name: Verify public article
        env:
          ARTICLE_URL: https://tteggu87.github.io/notes/authorization-aware-rag-graph-boundary
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 30); do
            if curl -fsSL --retry 2 --max-time 30 "$ARTICLE_URL" -o article.html; then
              if grep -q '17. 관련도는 권한이 아니다' article.html && grep -q '학교 전자도서관' article.html; then
                success=1
                break
              fi
            fi
            sleep 15
          done

          if [ "$success" -ne 1 ]; then
            cat > result.md <<EOF
          배포 확인 실패: 공개 페이지에서 새 제목과 교정 문구를 확인하지 못했습니다.

          - URL: $ARTICLE_URL
          - 확인 대상: 17번 글 제목, ‘학교 전자도서관’ 문구
          EOF
            echo 'verify_failed=1' >> "$GITHUB_ENV"
          else
            python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path('article.html').read_text(encoding='utf-8')
          h1_count = len(re.findall(r'<h1\b', html, flags=re.I))
          if h1_count != 1:
              raise SystemExit(f'public page structure check failed: h1_count={h1_count}')
          if '404 - Not Found' in html or 'Page not found' in html:
              raise SystemExit('public page contains not-found marker')
          PY
            cat > result.md <<EOF
          배포 확인 성공: 공개 페이지에 17번 글의 교정 내용이 반영되었습니다.

          - URL: $ARTICLE_URL
          - 확인 항목: 제목, ‘학교 전자도서관’ 문구, H1 1개, 404 표식 없음
          - 교정 병합 커밋: 861208599b5af1d068414ade6b53acb79fa225b9
          EOF
            echo 'verify_failed=0' >> "$GITHUB_ENV"
          fi

      - name: Comment verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/97/comments -f body="$(cat result.md)"

      - name: Fail when verification failed
        if: env.verify_failed == '1'
        run: exit 1
