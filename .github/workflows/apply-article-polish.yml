name: Format article readability polish

on:
  push:
    branches:
      - agent/polish-authorization-rag-20260729-1119

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format article
        run: npx prettier content/notes/authorization-aware-rag-graph-boundary.md --write

      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/notes/authorization-aware-rag-graph-boundary.md
          if git diff --cached --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "Format authorization-aware RAG article"
          git push origin HEAD
