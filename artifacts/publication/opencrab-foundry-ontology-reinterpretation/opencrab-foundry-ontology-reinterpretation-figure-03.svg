<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">

    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#17324D" flood-opacity="0.12"/>
      </filter>
      <marker id="arrowNavy" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L12,6 L0,12 z" fill="#17324D"/>
      </marker>
      <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L12,6 L0,12 z" fill="#2F7F7A"/>
      </marker>
      <style>
        text { font-family: Apple SD Gothic Neo, Pretendard, Noto Sans KR, sans-serif; fill: #263238; }
        .title { font-size: 46px; font-weight: 800; letter-spacing: -1px; }
        .subtitle { font-size: 26px; font-weight: 650; }
        .heading { font-size: 34px; font-weight: 800; }
        .cardTitle { font-size: 29px; font-weight: 800; }
        .body { font-size: 25px; font-weight: 600; }
        .small { font-size: 21px; font-weight: 600; }
        .tiny { font-size: 18px; font-weight: 600; }
      </style>
    </defs>

<rect width="1600" height="900" fill="#F7F3EA"/>
<text x="800" y="70" text-anchor="middle" dominant-baseline="middle" class="title" fill="#17324D">OpenCrab Pack · MCP 수명주기</text>
<text x="800" y="115" text-anchor="middle" dominant-baseline="middle" class="subtitle" fill="#2F7F7A">지식을 만들고 검증하고 Agent에 전달하는 공개 구조</text>
<rect x="90" y="155" width="295" height="88" rx="22" fill="#E8EEF3" stroke="#17324D" stroke-width="2" filter="url(#shadow)"/>
