<rect x="830" y="700" width="315" height="58" rx="17" fill="#F7ECD5" stroke="#D89B32" stroke-width="2"/>
<text x="987" y="729" text-anchor="middle" dominant-baseline="middle" class="small" fill="#263238">Pack 연합 계약 없음</text>
<rect x="1205" y="700" width="315" height="58" rx="17" fill="#F7ECD5" stroke="#D89B32" stroke-width="2"/>
<text x="1362" y="729" text-anchor="middle" dominant-baseline="middle" class="small" fill="#263238">QueryResult ≠ AnswerBundle</text>
<rect x="180" y="800" width="1240" height="64" rx="18" fill="#E8EEF3" stroke="#17324D" stroke-width="2"/>
<text x="800" y="832" text-anchor="middle" dominant-baseline="middle" class="subtitle" fill="#17324D">지식 유통은 보이지만 운영 강제와 Pack 연합은 아직 미완성</text>
</svg>
