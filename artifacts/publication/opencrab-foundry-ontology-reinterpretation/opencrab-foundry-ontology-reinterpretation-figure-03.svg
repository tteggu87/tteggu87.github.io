<text x="987" y="439" text-anchor="middle" dominant-baseline="middle" class="cardTitle" fill="#2F7F7A">MCP</text>
<line x1="1135" y1="439" x2="1205" y2="439" stroke="#2F7F7A" stroke-width="4" stroke-linecap="round"/><polygon points="1205.0,439.0 1189.0,448.3 1189.0,429.7" fill="#2F7F7A"/>
<rect x="1215" y="395" width="295" height="88" rx="22" fill="#E5F1EF" stroke="#2F7F7A" stroke-width="2" filter="url(#shadow)"/>
<text x="1362" y="439" text-anchor="middle" dominant-baseline="middle" class="cardTitle" fill="#2F7F7A">Agent</text>
<path d="M1510 199 L1550 199 L1550 330 L45 330 L45 439 L90 439" fill="none" stroke="#17324D" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="90.0,439.0 74.0,448.3 74.0,429.7" fill="#17324D"/>
<rect x="115" y="354" width="245" height="34" rx="13" fill="#D89B32" stroke="none" stroke-width="2"/>
<text x="238" y="371" text-anchor="middle" dominant-baseline="middle" class="tiny" fill="#FFFFFF">필수 게이트</text>
<rect x="490" y="354" width="245" height="34" rx="13" fill="#D89B32" stroke="none" stroke-width="2"/>
<text x="613" y="371" text-anchor="middle" dominant-baseline="middle" class="tiny" fill="#FFFFFF">필수 게이트</text>
<rect x="405" y="525" width="430" height="126" rx="18" fill="#FFFFFF" stroke="#D89B32" stroke-width="2" filter="url(#shadow)"/>
<text x="620" y="550" text-anchor="middle" dominant-baseline="middle" class="cardTitle" fill="#D89B32">Pack 내용</text>
<text x="620" y="570" text-anchor="middle" dominant-baseline="middle" class="small">manifest · nodes/edges</text><text x="620" y="600" text-anchor="middle" dominant-baseline="middle" class="small">evidence index · quality report</text><text x="620" y="630" text-anchor="middle" dominant-baseline="middle" class="small">Neo4j snapshot</text>
<rect x="865" y="525" width="645" height="126" rx="18" fill="#FFFFFF" stroke="#2F7F7A" stroke-width="2" filter="url(#shadow)"/>
<text x="1188" y="550" text-anchor="middle" dominant-baseline="middle" class="cardTitle" fill="#2F7F7A">MCP 도구 영역</text>
<text x="1188" y="570" text-anchor="middle" dominant-baseline="middle" class="small">온톨로지·검색 · Workflow·Approval</text><text x="1188" y="600" text-anchor="middle" dominant-baseline="middle" class="small">Identity·Promotion</text><text x="1188" y="630" text-anchor="middle" dominant-baseline="middle" class="small">Schema Pack · Billing · CrabHarness</text>
<rect x="80" y="700" width="315" height="58" rx="17" fill="#F7ECD5" stroke="#D89B32" stroke-width="2"/>
