<svg xmlns="http://www.w3.org/2000/svg" font-family="Apple SD Gothic Neo" viewBox="0 0 1792 1024" role="img" aria-labelledby="title desc">
<title id="title">장기 실행 작업의 다섯 권한 게이트</title>
<desc id="desc">생성, 보호 자료 읽기, 부작용 커밋, 결과 저장, 결과 공개의 다섯 게이트와 취소 뒤 늦은 저장과 전송 차단을 두 줄 흐름으로 보여주는 상세 도해.</desc>
<rect width="1792" height="1024" fill="#F7F6F2"/>
<style>
text{fill:#17212B}
.title{font-size:88px;font-weight:800}
.subtitle{font-size:74px;font-weight:700;fill:#59636E}
.heading{font-size:78px;font-weight:800}
.body{font-size:74px;font-weight:750}
.note{font-size:70px;font-weight:750}
</style>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.13"/></filter></defs>
<text x="90" y="100" class="title" text-anchor="start">생성부터 공개까지 다섯 게이트를 닫습니다</text><text x="90" y="175" class="subtitle" text-anchor="start">각 보호 경계에서 현재 상태를 다시 판정합니다.</text><rect x="250" y="225" width="1292" height="100" rx="28" fill="#FFF1F1" stroke="#B23535" stroke-width="4"/><text x="896" y="294" class="body" text-anchor="middle" fill="#B23535">회수 · 만료 · 변경 · 취소  →  무효화</text><rect x="70" y="385" width="500" height="185" rx="30" fill="#FFFFFF" stroke="#1E5AA8" stroke-width="5" filter="url(#shadow)"/><text x="320" y="463" class="heading" text-anchor="middle" fill="#1E5AA8">1  생성</text><text x="320" y="530" class="note" text-anchor="middle">context 결속</text><rect x="646" y="385" width="500" height="185" rx="30" fill="#FFFFFF" stroke="#177C75" stroke-width="5" filter="url(#shadow)"/><text x="896" y="463" class="heading" text-anchor="middle" fill="#177C75">2  자료 읽기</text><text x="896" y="530" class="note" text-anchor="middle">lease · revision</text><rect x="1222" y="385" width="500" height="185" rx="30" fill="#FFFFFF" stroke="#C35A18" stroke-width="5" filter="url(#shadow)"/><text x="1472" y="463" class="heading" text-anchor="middle" fill="#C35A18">3  부작용 커밋</text><text x="1472" y="530" class="note" text-anchor="middle">현재 행동 권한</text><rect x="934" y="685" width="500" height="185" rx="30" fill="#FFFFFF" stroke="#6A4FA3" stroke-width="5" filter="url(#shadow)"/><text x="1184" y="763" class="heading" text-anchor="middle" fill="#6A4FA3">4  결과 저장</text><text x="1184" y="830" class="note" text-anchor="middle">cancel epoch</text><rect x="358" y="685" width="500" height="185" rx="30" fill="#FFFFFF" stroke="#1E5AA8" stroke-width="5" filter="url(#shadow)"/><text x="608" y="763" class="heading" text-anchor="middle" fill="#1E5AA8">5  결과 공개</text><text x="608" y="830" class="note" text-anchor="middle">현재 호출자 권한</text><line x1="575" y1="478" x2="611.0" y2="478.0" stroke="#17212B" stroke-width="7" stroke-linecap="round"/><polygon points="635,478 611.0,491.92 611.0,464.08" fill="#17212B"/><line x1="1151" y1="478" x2="1187.0" y2="478.0" stroke="#17212B" stroke-width="7" stroke-linecap="round"/><polygon points="1211,478 1187.0,491.92 1187.0,464.08" fill="#17212B"/><line x1="1472" y1="575" x2="1206.6721679416348" y2="667.1277194647101" stroke="#17212B" stroke-width="7" stroke-linecap="round"/><polygon points="1184,675 1202.1062452311667,653.9778620585619 1211.238090652103,680.2775768708584" fill="#17212B"/><line x1="924" y1="778" x2="892.0" y2="778.0" stroke="#17212B" stroke-width="7" stroke-linecap="round"/><polygon points="868,778 892.0,764.08 892.0,791.92" fill="#17212B"/><line x1="896" y1="327" x2="896.0" y2="353.0" stroke="#B23535" stroke-width="7" stroke-linecap="round"/><polygon points="896,375 883.24,353.0 908.76,353.0" fill="#B23535"/><line x1="1472" y1="327" x2="1472.0" y2="353.0" stroke="#B23535" stroke-width="7" stroke-linecap="round"/><polygon points="1472,375 1459.24,353.0 1484.76,353.0" fill="#B23535"/><line x1="1184" y1="327" x2="1184.0" y2="353.0" stroke="#B23535" stroke-width="7" stroke-linecap="round"/><polygon points="1184,375 1171.24,353.0 1196.76,353.0" fill="#B23535"/><line x1="608" y1="327" x2="608.0" y2="353.0" stroke="#B23535" stroke-width="7" stroke-linecap="round"/><polygon points="608,375 595.24,353.0 620.76,353.0" fill="#B23535"/><rect x="90" y="905" width="910" height="90" rx="24" fill="#EAF0F7" stroke="#1E5AA8" stroke-width="4"/><text x="545" y="968" class="heading" text-anchor="middle" fill="#1E5AA8">완료  ≠  결과 공개 권한</text><rect x="1080" y="905" width="620" height="90" rx="24" fill="#FFF7EA" stroke="#C35A18" stroke-width="4"/><text x="1390" y="968" class="note" text-anchor="middle" fill="#C35A18">취소 뒤 늦은 저장·전송 차단</text>
</svg>