<svg xmlns="http://www.w3.org/2000/svg" font-family="Apple SD Gothic Neo" viewBox="0 0 1792 1024" role="img" aria-labelledby="title desc">
<title id="title">장기 실행 작업의 네 가지 독립 시계</title>
<desc id="desc">작업 TTL, 자격증명 만료, 권한 lease, ACL과 자료 revision이 서로 독립적이며 보편적인 시간 임계값이 없음을 보여주는 도해.</desc>
<rect width="1792" height="1024" fill="#F7F6F2"/>
<style>
text{fill:#17212B}
.title{font-size:88px;font-weight:800}
.subtitle{font-size:74px;font-weight:700;fill:#59636E}
.heading{font-size:78px;font-weight:800}
.body{font-size:74px;font-weight:750}
.note{font-size:70px;font-weight:750}
</style>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.13"/></filter></defs>
<text x="90" y="100" class="title" text-anchor="start">장기 작업에는 네 개의 독립 시계가 흐릅니다</text><text x="90" y="175" class="subtitle" text-anchor="start">한 시계가 다른 시계의 유효성을 보증하지 않습니다.</text><rect x="70" y="235" width="800" height="245" rx="34" fill="#FFFFFF" stroke="#1E5AA8" stroke-width="5" filter="url(#shadow)"/><circle cx="160" cy="353" r="55" fill="none" stroke="#1E5AA8" stroke-width="8"/><line x1="160" y1="353" x2="160" y2="313" stroke="#1E5AA8" stroke-width="8" stroke-linecap="round"/><line x1="160" y1="353" x2="196" y2="370" stroke="#1E5AA8" stroke-width="8" stroke-linecap="round"/><text x="250" y="313" class="heading" text-anchor="start">작업 TTL</text><text x="250" y="385" class="body" text-anchor="start">상태·결과 보존</text><text x="250" y="450" class="note" text-anchor="start" fill="#1E5AA8">권한 기간 아님</text><rect x="922" y="235" width="800" height="245" rx="34" fill="#FFFFFF" stroke="#177C75" stroke-width="5" filter="url(#shadow)"/><circle cx="1012" cy="353" r="55" fill="none" stroke="#177C75" stroke-width="8"/><line x1="1012" y1="353" x2="1012" y2="313" stroke="#177C75" stroke-width="8" stroke-linecap="round"/><line x1="1012" y1="353" x2="1048" y2="370" stroke="#177C75" stroke-width="8" stroke-linecap="round"/><text x="1102" y="313" class="heading" text-anchor="start">자격증명 만료</text><text x="1102" y="385" class="body" text-anchor="start">token 사용 기간</text><text x="1102" y="450" class="note" text-anchor="start" fill="#177C75">자료 권한 아님</text><rect x="70" y="555" width="800" height="245" rx="34" fill="#FFFFFF" stroke="#C35A18" stroke-width="5" filter="url(#shadow)"/><circle cx="160" cy="673" r="55" fill="none" stroke="#C35A18" stroke-width="8"/><line x1="160" y1="673" x2="160" y2="633" stroke="#C35A18" stroke-width="8" stroke-linecap="round"/><line x1="160" y1="673" x2="196" y2="690" stroke="#C35A18" stroke-width="8" stroke-linecap="round"/><text x="250" y="633" class="heading" text-anchor="start">권한 lease</text><text x="250" y="705" class="body" text-anchor="start">판정 재사용 기간</text><text x="250" y="770" class="note" text-anchor="start" fill="#C35A18">만료 후 재검사</text><rect x="922" y="555" width="800" height="245" rx="34" fill="#FFFFFF" stroke="#6A4FA3" stroke-width="5" filter="url(#shadow)"/><circle cx="1012" cy="673" r="55" fill="none" stroke="#6A4FA3" stroke-width="8"/><line x1="1012" y1="673" x2="1012" y2="633" stroke="#6A4FA3" stroke-width="8" stroke-linecap="round"/><line x1="1012" y1="673" x2="1048" y2="690" stroke="#6A4FA3" stroke-width="8" stroke-linecap="round"/><text x="1102" y="633" class="heading" text-anchor="start">ACL·자료 버전</text><text x="1102" y="705" class="body" text-anchor="start">현재 ACL·버전</text><text x="1102" y="770" class="note" text-anchor="start" fill="#6A4FA3">시작 때와 다를 수 있음</text><rect x="205" y="875" width="1382" height="125" rx="28" fill="#FFF1F1" stroke="#B23535" stroke-width="4"/><text x="896" y="930" class="heading" text-anchor="middle" fill="#B23535">보편적인 초 단위 기준은 없습니다.</text><text x="896" y="987" class="note" text-anchor="middle">민감도 · 위험 · 회수 지연으로 결정합니다.</text>
</svg>