<svg xmlns="http://www.w3.org/2000/svg" font-family="Apple SD Gothic Neo" viewBox="0 0 1792 1024" role="img" aria-labelledby="title desc">
<title id="title">snapshot-safe 작업과 live-sensitive 작업의 차이</title>
<desc id="desc">봉인된 입력으로 계산하는 snapshot-safe 작업과 실행 중 새 보호 자료와 도구를 쓰는 live-sensitive 작업의 재검사 흐름을 비교한 도해.</desc>
<rect width="1792" height="1024" fill="#F7F6F2"/>
<style>
text{fill:#17212B}
.title{font-size:88px;font-weight:800}
.subtitle{font-size:74px;font-weight:700;fill:#59636E}
.heading{font-size:78px;font-weight:800}
.body{font-size:74px;font-weight:750}
.note{font-size:70px;font-weight:750}
</style>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.13"/></filter></defs>
<text x="90" y="100" class="title" text-anchor="start">snapshot-safe와 live-sensitive를 분리합니다</text><text x="90" y="175" class="subtitle" text-anchor="start">계산 지속과 결과 공개는 별도 판정입니다.</text><rect x="70" y="225" width="805" height="650" rx="36" fill="#EDF7F5" stroke="#177C75" stroke-width="5" filter="url(#shadow)"/><rect x="917" y="225" width="805" height="650" rx="36" fill="#FFF5EB" stroke="#C35A18" stroke-width="5" filter="url(#shadow)"/><text x="472" y="305" class="heading" text-anchor="middle" fill="#177C75">Snapshot-safe</text><text x="472" y="375" class="body" text-anchor="middle">봉인 입력만 사용</text><text x="1319" y="305" class="heading" text-anchor="middle" fill="#C35A18">Live-sensitive</text><text x="1319" y="375" class="body" text-anchor="middle">새 보호 자료·도구 사용</text><rect x="182" y="400" width="580" height="110" rx="24" fill="#FFFFFF" stroke="#177C75" stroke-width="4"/><text x="472" y="475" class="body" text-anchor="middle">입력·revision 봉인</text><line x1="472" y1="513" x2="472.0" y2="526.0" stroke="#177C75" stroke-width="7" stroke-linecap="round"/><polygon points="472,550 458.08,526.0 485.92,526.0" fill="#177C75"/><rect x="182" y="555" width="580" height="110" rx="24" fill="#FFFFFF" stroke="#177C75" stroke-width="4"/><text x="472" y="630" class="body" text-anchor="middle">순수 계산</text><line x1="472" y1="668" x2="472.0" y2="681.0" stroke="#177C75" stroke-width="7" stroke-linecap="round"/><polygon points="472,705 458.08,681.0 485.92,681.0" fill="#177C75"/><rect x="182" y="710" width="580" height="110" rx="24" fill="#FFFFFF" stroke="#177C75" stroke-width="4"/><text x="472" y="785" class="body" text-anchor="middle">저장·공개 재검사</text><rect x="1029" y="400" width="580" height="110" rx="24" fill="#FFFFFF" stroke="#C35A18" stroke-width="4"/><text x="1319" y="475" class="body" text-anchor="middle">보호 자료 재검사</text><line x1="1319" y1="513" x2="1319.0" y2="526.0" stroke="#C35A18" stroke-width="7" stroke-linecap="round"/><polygon points="1319,550 1305.08,526.0 1332.92,526.0" fill="#C35A18"/><rect x="1029" y="555" width="580" height="110" rx="24" fill="#FFFFFF" stroke="#C35A18" stroke-width="4"/><text x="1319" y="630" class="body" text-anchor="middle">그래프·도구 재검사</text><line x1="1319" y1="668" x2="1319.0" y2="681.0" stroke="#C35A18" stroke-width="7" stroke-linecap="round"/><polygon points="1319,705 1305.08,681.0 1332.92,681.0" fill="#C35A18"/><rect x="1029" y="710" width="580" height="110" rx="24" fill="#FFFFFF" stroke="#C35A18" stroke-width="4"/><text x="1319" y="785" class="body" text-anchor="middle">부작용 재검사</text><rect x="250" y="910" width="1292" height="90" rx="26" fill="#EAF0F7" stroke="#1E5AA8" stroke-width="3"/><text x="896" y="973" class="heading" text-anchor="middle" fill="#1E5AA8">만료 · 회수 · 취소  →  보호 행동 중단</text>
</svg>