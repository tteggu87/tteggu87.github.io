  <g transform="translate(115 885)" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">
    <rect width="1562" height="82" rx="28" fill="#F2B84B"/>
    <text x="781" y="54" text-anchor="middle" fill="#0F1D30" font-size="42" font-weight="900">고정: 같은 질문·모델 · 같은 revision·권한 · 같은 예산·생성기</text>
