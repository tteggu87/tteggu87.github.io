<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">저장 ≠ 신뢰 ≠ 승격</title>
<desc id="desc">신뢰할 수 없는 입력이 후보 격리, 검토된 승격, 문맥별 검색, 행동 전 확인을 거쳐 안전한 실행으로 이어지는 메모리 신뢰 수명주기</desc>
<rect width="1600" height="900" fill="#F7F3EA"/>
<rect width="1600" height="104" fill="#102A43"/>
<text x="70" y="66" fill="#FFFFFF" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="38" font-weight="700" text-anchor="start">저장 ≠ 신뢰 ≠ 승격</text>
<text x="72" y="150" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="600" text-anchor="start">메모리의 양이 아니라 권위를 얻는 경로를 통제합니다</text>
<rect x="80" y="245" width="240" height="150" rx="18" fill="#FBEAEA" stroke="#C95050" stroke-width="3"/>
<text x="200.0" y="299" fill="#203647" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">외부 입력</text>
<text x="200.0" y="337" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="middle">문서·도구·요약</text>
<line x1="320" y1="320" x2="350" y2="320" stroke="#2B8A86" stroke-width="5" stroke-linecap="round"/>
<path d="M 336 311 L 350 320 L 336 329" fill="none" stroke="#2B8A86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="370" y="245" width="240" height="150" rx="18" fill="#FFFFFF" stroke="#E5A73E" stroke-width="3"/>
<text x="490.0" y="299" fill="#203647" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">후보 격리</text>
<text x="490.0" y="337" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="middle">출처·유형 분리</text>
<line x1="610" y1="320" x2="640" y2="320" stroke="#2B8A86" stroke-width="5" stroke-linecap="round"/>
<path d="M 626 311 L 640 320 L 626 329" fill="none" stroke="#2B8A86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="660" y="245" width="240" height="150" rx="18" fill="#FFFFFF" stroke="#E5A73E" stroke-width="3"/>
<text x="780.0" y="299" fill="#203647" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">검토된 승격</text>
<text x="780.0" y="337" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="middle">범위·반례·revision</text>
<line x1="900" y1="320" x2="930" y2="320" stroke="#2B8A86" stroke-width="5" stroke-linecap="round"/>
<path d="M 916 311 L 930 320 L 916 329" fill="none" stroke="#2B8A86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="950" y="245" width="240" height="150" rx="18" fill="#FFFFFF" stroke="#2B8A86" stroke-width="3"/>
<text x="1070.0" y="299" fill="#203647" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">문맥별 검색</text>
<text x="1070.0" y="337" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="middle">조합·tenant 재검사</text>
<line x1="1190" y1="320" x2="1220" y2="320" stroke="#2B8A86" stroke-width="5" stroke-linecap="round"/>
<path d="M 1206 311 L 1220 320 L 1206 329" fill="none" stroke="#2B8A86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1240" y="245" width="240" height="150" rx="18" fill="#FFFFFF" stroke="#2B8A86" stroke-width="3"/>
<text x="1360.0" y="299" fill="#203647" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">행동 전 확인</text>
<text x="1360.0" y="337" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="middle">의도·권한·부작용</text>
<text x="800" y="470" fill="#102A43" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="27" font-weight="700" text-anchor="middle">저장됐다는 사실은 진실성·권위·현재 범위·행동 안전을 보장하지 않습니다</text>
<rect x="120" y="540" width="410" height="150" rx="18" fill="#E9F3F2" stroke="#2B8A86" stroke-width="3"/>
<text x="325.0" y="594" fill="#203647" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">WRITE</text>
<text x="325.0" y="632" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="middle">원문·작성 주체·유형</text>
<rect x="595" y="540" width="410" height="150" rx="18" fill="#FFF4DF" stroke="#E5A73E" stroke-width="3"/>
<text x="800.0" y="594" fill="#203647" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">PROMOTION</text>
<text x="800.0" y="632" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="middle">조합·활성화·rollback</text>
<rect x="1070" y="540" width="410" height="150" rx="18" fill="#EAF4EE" stroke="#3B806F" stroke-width="3"/>
<text x="1275.0" y="594" fill="#203647" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="26" font-weight="700" text-anchor="middle">RETRIEVAL / COMMIT</text>
<text x="1275.0" y="632" fill="#587086" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="19" font-weight="500" text-anchor="middle">현재 scope·권한·의도</text>
<rect x="210" y="735" width="1180" height="80" rx="18" fill="#102A43"/>
<text x="800" y="785" fill="#FFFFFF" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="28" font-weight="700" text-anchor="middle">권한 있음 ≠ 신뢰 가능 · 신뢰 가능 ≠ 현재 사용자에게 공개 가능</text>
</svg>