<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">누적 비교와 기여 확인 설계</title>
  <desc id="desc">A부터 D까지 누적 시스템 비교를 제거 비교와 상호작용 실험으로 분리하고 제한 운영과 증거 재개방으로 잇는 미실행 평가 계획</desc>
  <rect width="1600" height="900" fill="#F6F1E8"/>
  <rect x="55" y="45" width="1490" height="810" rx="38" fill="#FFFDF8" stroke="#173B57" stroke-width="5"/>
  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <text x="800" y="118" font-size="58" font-weight="900" fill="#173B57">누적 비교만으로 기여를 확정하지 않습니다</text>
    <rect x="495" y="145" width="610" height="68" rx="20" fill="#FFF1EB" stroke="#D16A4B" stroke-width="4"/>
    <text x="800" y="192" font-size="36" font-weight="900" fill="#A94F37">평가 설계 · 아직 실행 아님</text>

    <rect x="85" y="255" width="325" height="175" rx="26" fill="#E8EEF1" stroke="#173B57" stroke-width="5"/>
    <text x="247" y="315" font-size="50" font-weight="900" fill="#173B57">A 기준선</text>
    <text x="247" y="375" font-size="34" font-weight="750" fill="#2B2B2B">규칙 · lexical</text>
    <path d="M420 342 H475" stroke="#173B57" stroke-width="9"/><polygon points="475,326 500,342 475,358" fill="#173B57"/>

    <rect x="500" y="255" width="325" height="175" rx="26" fill="#E8EEF1" stroke="#173B57" stroke-width="5"/>
    <text x="662" y="315" font-size="50" font-weight="900" fill="#173B57">B 검색</text>
    <text x="662" y="375" font-size="34" font-weight="750" fill="#2B2B2B">+ vector · hybrid</text>
    <path d="M835 342 H890" stroke="#173B57" stroke-width="9"/><polygon points="890,326 915,342 890,358" fill="#173B57"/>

    <rect x="915" y="255" width="280" height="175" rx="26" fill="#E9F0E9" stroke="#5B7F62" stroke-width="5"/>
    <text x="1055" y="315" font-size="50" font-weight="900" fill="#355B3C">C 그래프</text>
    <text x="1055" y="375" font-size="34" font-weight="750" fill="#2B2B2B">+ graph route</text>
    <path d="M1205 342 H1260" stroke="#173B57" stroke-width="9"/><polygon points="1260,326 1285,342 1260,358" fill="#173B57"/>

    <rect x="1285" y="255" width="230" height="175" rx="26" fill="#F5EDE4" stroke="#D16A4B" stroke-width="5"/>
    <text x="1400" y="315" font-size="50" font-weight="900" fill="#A94F37">D 제어</text>
    <text x="1400" y="365" font-size="30" font-weight="750" fill="#2B2B2B">query · pruning</text>
    <text x="1400" y="405" font-size="30" font-weight="750" fill="#2B2B2B">stopping</text>

    <rect x="110" y="500" width="420" height="175" rx="28" fill="#E9F0E9" stroke="#5B7F62" stroke-width="5"/>
    <text x="320" y="560" font-size="44" font-weight="900" fill="#355B3C">제거 비교</text>
    <text x="320" y="615" font-size="32" font-weight="750" fill="#2B2B2B">remove-one · ablation</text>
    <text x="320" y="652" font-size="28" font-weight="650" fill="#2B2B2B">요소와 신호를 꺼서 비교</text>

    <rect x="590" y="500" width="420" height="175" rx="28" fill="#E9F0E9" stroke="#5B7F62" stroke-width="5"/>
    <text x="800" y="560" font-size="44" font-weight="900" fill="#355B3C">상호작용 확인</text>
    <text x="800" y="615" font-size="32" font-weight="750" fill="#2B2B2B">factorial</text>
    <text x="800" y="652" font-size="28" font-weight="650" fill="#2B2B2B">route × adapter를 분리</text>

    <rect x="1070" y="500" width="420" height="175" rx="28" fill="#F5EDE4" stroke="#D16A4B" stroke-width="5"/>
    <text x="1280" y="560" font-size="44" font-weight="900" fill="#A94F37">제한 운영</text>
    <text x="1280" y="615" font-size="32" font-weight="750" fill="#2B2B2B">shadow → canary</text>
    <text x="1280" y="652" font-size="28" font-weight="650" fill="#2B2B2B">monitor · rollback</text>

    <rect x="155" y="725" width="610" height="84" rx="22" fill="#FFF1EB" stroke="#D16A4B" stroke-width="4"/>
    <text x="460" y="781" font-size="38" font-weight="900" fill="#A94F37">DuckCrab 동일 예산 E2E: 미실행</text>
    <rect x="835" y="725" width="610" height="84" rx="22" fill="#FFF1EB" stroke="#D16A4B" stroke-width="4"/>
    <text x="1140" y="781" font-size="38" font-weight="900" fill="#A94F37">실패 발견 → 증거 게이트 재개방</text>
  </g>
</svg>
